services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: simone
      POSTGRES_PASSWORD: simone
      POSTGRES_DB: simone_moura
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simone -d simone_moura"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
